<!doctype html>
<html>
  <head>
    <link rel="icon" type="image/x-icon" href="../images/polar.png" />
    <link rel="stylesheet" href="../bulma.min.css" type="text/css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
  </head>

  <body>
    <div class="container">
      <article class="message">
        <span class="message-header">
          <div class="box">
            <h1 class="title is-1">Day 3</h1>
          </div>
          <div class="box">
            <button class="button"><a href="../index.html">Go Home</a></button>
          </div>
        </span>
        <div class="message-body">
          <div class="notification">
            <p>
              The elves left a lift unattended and you make your escape.
            </p>
          </div>
          <div class="card">
            <div class="card-content">
              <div class="content">
                <label for="textInput">Enter Text Part 1:</label>
                <textarea class="textarea" id="textInput" placeholder=""></textarea>
              </div>
            </div>
            <footer class="card-footer">
              <span class="container">
                <div class="box">
                  <span>Output Part 1:</span>
                  <span id="outputPart1"></span>
                </div>
              </span>
              <span class="container">
                <div class="box">
                  <span>Output Part 2:</span>
                  <span id="outputPart2"></span>
                </div>
              </span>
            </footer>
          </div>
        </div>
      </article>
    </div>

    <script defer src="../day3.js" type="module"></script>
  </body>
</html>
