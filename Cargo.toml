[package]
name = "advent-code-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.72", features = ["Window", "Document", "HtmlElement", "console"] }
wasm-bindgen = "0.2.95"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ndarray = "0.16.1"
serde-wasm-bindgen = "0.6.5"
once_cell = "1.21.3"
num-traits = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]
